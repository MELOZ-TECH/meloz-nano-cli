name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before opening, please check `docs/TROUBLESHOOTING.md`.
        Do not include secrets or private paths.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe the behavior you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make bootstrap
        2. nano up
        3. docker run ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `nano --version`
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.1 / Apple M2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `~/.nano/daemon.log` and `~/.nano/dockerd.log`
      render: shell
