name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit tests
        run: go test ./...
      # Integração NÃO roda no CI: runners do GitHub são VMs e o macOS não
      # permite virtualização aninhada. Use `make itest` num Mac real.
