name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: test
        run: |
          go vet ./...
          go test ./...
      - name: build artifact
        run: make release VERSION=${GITHUB_REF_NAME}
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: nano-*.tar.gz
          generate_release_notes: true
