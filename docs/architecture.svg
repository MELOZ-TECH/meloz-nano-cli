<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <linearGradient id="mac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/><stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="vm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef7f1"/><stop offset="100%" stop-color="#e3f1e8"/>
    </linearGradient>
  </defs>

  <rect width="1180" height="720" fill="#ffffff"/>
  <text x="32" y="46" font-size="24" font-weight="700" fill="#1d2733">nano-container architecture</text>
  <text x="32" y="70" font-size="14" fill="#5b6b7c">one binary, one VM, no GUI — Docker socket bridged over virtio-vsock</text>

  <!-- macOS host -->
  <rect x="32" y="96" width="1116" height="252" rx="14" fill="url(#mac)" stroke="#c9d4e0"/>
  <text x="52" y="124" font-size="13" font-weight="700" fill="#5b6b7c">macOS (Apple Silicon)</text>

  <rect x="56" y="140" width="220" height="86" rx="10" fill="#ffffff" stroke="#c9d4e0"/>
  <text x="72" y="166" font-size="14" font-weight="700" fill="#1d2733">nanoc CLI</text>
  <text x="72" y="188" font-size="12" fill="#5b6b7c">up · down · status · ports</text>
  <text x="72" y="206" font-size="12" fill="#5b6b7c">exec · k8s · machine</text>

  <rect x="332" y="140" width="250" height="86" rx="10" fill="#ffffff" stroke="#c9d4e0"/>
  <text x="348" y="166" font-size="14" font-weight="700" fill="#1d2733">nanoc daemon</text>
  <text x="348" y="188" font-size="12" fill="#5b6b7c">manages the VM, proxies sockets</text>
  <text x="348" y="206" font-size="12" fill="#5b6b7c">port-forward · k8s API proxy</text>

  <rect x="638" y="140" width="226" height="86" rx="10" fill="#ffffff" stroke="#c9d4e0"/>
  <text x="654" y="166" font-size="14" font-weight="700" fill="#1d2733">docker CLI</text>
  <text x="654" y="188" font-size="12" fill="#5b6b7c">compose, build, pull…</text>

  <rect x="920" y="140" width="204" height="86" rx="10" fill="#ffffff" stroke="#c9d4e0"/>
  <text x="936" y="166" font-size="14" font-weight="700" fill="#1d2733">kubectl</text>
  <text x="936" y="188" font-size="12" fill="#5b6b7c">optional, off by default</text>
  <text x="936" y="206" font-size="12" fill="#5b6b7c">127.0.0.1:6443</text>

  <!-- sockets row -->
  <rect x="56" y="256" width="220" height="66" rx="10" fill="#f4f7fb" stroke="#d8e1ea"/>
  <text x="72" y="280" font-size="12" font-weight="600" fill="#1d2733">~/.nanoc/nanoc.sock</text>
  <text x="72" y="300" font-size="11" fill="#5b6b7c">control plane (unix)</text>

  <rect x="332" y="256" width="250" height="66" rx="10" fill="#f4f7fb" stroke="#d8e1ea"/>
  <text x="348" y="280" font-size="12" font-weight="600" fill="#1d2733">~/.nanoc/docker.sock</text>
  <text x="348" y="300" font-size="11" fill="#5b6b7c">DOCKER_HOST (unix)</text>

  <rect x="638" y="256" width="226" height="66" rx="10" fill="#f4f7fb" stroke="#d8e1ea"/>
  <text x="654" y="280" font-size="12" font-weight="600" fill="#1d2733">127.0.0.1:&lt;port&gt;</text>
  <text x="654" y="300" font-size="11" fill="#5b6b7c">published container ports</text>

  <rect x="920" y="256" width="204" height="66" rx="10" fill="#f4f7fb" stroke="#d8e1ea"/>
  <text x="936" y="280" font-size="12" font-weight="600" fill="#1d2733">~/.nanoc/kubeconfig</text>
  <text x="936" y="300" font-size="11" fill="#5b6b7c">generated by k3s</text>

  <!-- arrows host -->
  <line x1="276" y1="183" x2="328" y2="183" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="166" y1="226" x2="166" y2="252" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="457" y1="226" x2="457" y2="252" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="751" y1="226" x2="751" y2="252" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1022" y1="226" x2="1022" y2="252" stroke="#5b6b7c" stroke-width="1.6"/>

  <!-- VM -->
  <rect x="32" y="380" width="1116" height="312" rx="14" fill="url(#vm)" stroke="#bcd8c6"/>
  <text x="52" y="408" font-size="13" font-weight="700" fill="#3f6b52">Linux guest — Virtualization.framework VM (1 GB RAM, 2 vCPU)</text>

  <rect x="56" y="424" width="300" height="118" rx="10" fill="#ffffff" stroke="#bcd8c6"/>
  <text x="72" y="450" font-size="14" font-weight="700" fill="#1d2733">nanoc-agent</text>
  <text x="72" y="472" font-size="12" fill="#5b6b7c">:2375 docker proxy · :2376 control</text>
  <text x="72" y="492" font-size="12" fill="#5b6b7c">AF_VSOCK + TCP</text>
  <text x="72" y="512" font-size="12" fill="#5b6b7c">exec via nsenter</text>
  <text x="72" y="532" font-size="12" fill="#5b6b7c">k3s enable/disable</text>

  <rect x="384" y="424" width="290" height="118" rx="10" fill="#ffffff" stroke="#bcd8c6"/>
  <text x="400" y="450" font-size="14" font-weight="700" fill="#1d2733">dockerd + containerd</text>
  <text x="400" y="472" font-size="12" fill="#5b6b7c">overlay2 · buildkit</text>
  <text x="400" y="492" font-size="12" fill="#5b6b7c">containers, images, volumes</text>
  <text x="400" y="512" font-size="12" fill="#5b6b7c">qemu-x86_64 via binfmt</text>

  <rect x="702" y="424" width="196" height="118" rx="10" fill="#ffffff" stroke="#bcd8c6"/>
  <text x="718" y="450" font-size="14" font-weight="700" fill="#1d2733">k3s (optional)</text>
  <text x="718" y="472" font-size="12" fill="#5b6b7c">single node</text>
  <text x="718" y="492" font-size="12" fill="#5b6b7c">API on :6443</text>

  <rect x="926" y="424" width="198" height="118" rx="10" fill="#ffffff" stroke="#bcd8c6"/>
  <text x="942" y="450" font-size="14" font-weight="700" fill="#1d2733">guestinit (PID 1)</text>
  <text x="942" y="472" font-size="12" fill="#5b6b7c">mounts, modules,</text>
  <text x="942" y="492" font-size="12" fill="#5b6b7c">overlay, then chroot</text>

  <!-- storage row -->
  <rect x="56" y="562" width="300" height="106" rx="10" fill="#f7fbf8" stroke="#cfe6d8"/>
  <text x="72" y="586" font-size="13" font-weight="700" fill="#1d2733">EROFS rootfs (read-only)</text>
  <text x="72" y="606" font-size="12" fill="#5b6b7c">124 MB compressed image</text>
  <text x="72" y="626" font-size="12" fill="#5b6b7c">+ tmpfs overlay (writable)</text>
  <text x="72" y="646" font-size="12" fill="#5b6b7c">squashfs fallback</text>

  <rect x="384" y="562" width="290" height="106" rx="10" fill="#f7fbf8" stroke="#cfe6d8"/>
  <text x="400" y="586" font-size="13" font-weight="700" fill="#1d2733">data.img (ext4, sparse)</text>
  <text x="400" y="606" font-size="12" fill="#5b6b7c">/var/lib/docker</text>
  <text x="400" y="626" font-size="12" fill="#5b6b7c">loop device on the virtiofs share</text>

  <rect x="702" y="562" width="422" height="106" rx="10" fill="#f7fbf8" stroke="#cfe6d8"/>
  <text x="718" y="586" font-size="13" font-weight="700" fill="#1d2733">virtiofs shares</text>
  <text x="718" y="606" font-size="12" fill="#5b6b7c">/Users → host home (bind mounts: -v /Users/you/code:/app)</text>
  <text x="718" y="626" font-size="12" fill="#5b6b7c">state dir → rootfs.erofs, data.img, machine disks</text>
  <text x="718" y="646" font-size="12" fill="#5b6b7c">machine VMs: separate data.img + sshd on :2222</text>

  <!-- VM border label -->
  <text x="1116" y="700" font-size="11" fill="#5b6b7c" text-anchor="end">virtio-blk · virtio-net (NAT 192.168.64.2) · virtio-vsock · virtio-fs</text>

  <!-- arrows into VM -->
  <line x1="457" y1="322" x2="457" y2="376" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="466" y="352" font-size="11" fill="#5b6b7c">vsock / TCP 2375</text>
  <line x1="751" y1="322" x2="751" y2="376" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="760" y="352" font-size="11" fill="#5b6b7c">host port forward</text>
  <line x1="1022" y1="322" x2="1022" y2="376" stroke="#5b6b7c" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1031" y="352" font-size="11" fill="#5b6b7c">:6443</text>
</svg>
